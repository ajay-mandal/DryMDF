name: Desktop CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-15
    outputs:
      installer: ${{ steps.installer.outputs.name }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Resolve installer name
        id: installer
        working-directory: apps/desktop
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME must match desktop package version v$version." >&2
            exit 1
          fi
          printf 'name=%s\n' "$(sh make-dmg.sh --name)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Check code quality
        run: |
          pnpm --filter @drymdf/frontend lint
          pnpm --filter @drymdf/backend lint:check
          pnpm type-check
          pnpm format:check
          pnpm --filter @drymdf/backend build
      - name: Package Apple Silicon installer
        run: pnpm --filter @drymdf/desktop make
      - name: Verify installer
        working-directory: apps/desktop/out/make
        env:
          INSTALLER: ${{ steps.installer.outputs.name }}
        run: |
          shasum -a 256 -c "$INSTALLER.sha256"
          hdiutil verify "$INSTALLER"
      - uses: actions/upload-artifact@v4
        with:
          name: DryMDF-mac-arm64
          path: |
            apps/desktop/out/make/${{ steps.installer.outputs.name }}
            apps/desktop/out/make/${{ steps.installer.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft-release:
    needs: quality
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DryMDF-mac-arm64
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ needs.quality.outputs.installer }}
        run: |
          sha256sum -c "$INSTALLER.sha256"
          gh release create "$GITHUB_REF_NAME" "$INSTALLER" "$INSTALLER.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "DryMDF ${GITHUB_REF_NAME#v}"
